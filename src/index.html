<!--
    Only the body: the Webflow CLI and the Designer put this inside a page of
    their own, which loads the Designer API before index.js
-->
<style>
    /* The Designer's own panels: dark by default, light when the Designer's
       appearance is light (data-theme, set by designer.ts) */
    :root {
        color-scheme: dark;
        --text: #f5f5f5;
        --text-secondary: #a3a3a3;
        --text-tertiary: #7c7c7c;
        --bg: #2b2b2b;
        --bg-secondary: #363636;
        --bg-selected: rgb(20 110 245 / 0.25);
        --bg-warning-tertiary: #4d3d12;
        --border: #444444;
        --border-selected: #146ef5;
    }
    :root[data-theme='light'] {
        color-scheme: light;
        --text: #1e1e1e;
        --text-secondary: #6b6b6b;
        --text-tertiary: #9a9a9a;
        --bg: #ffffff;
        --bg-secondary: #ebebeb;
        --bg-selected: rgb(20 110 245 / 0.12);
        --bg-warning-tertiary: #fff1c2;
        --border: #dedede;
    }
    * {
        box-sizing: border-box;
        margin: 0;
    }

    html,
    body {
        height: 100%;
    }
    body {
        display: flex;
        flex-direction: column;
        font:
            11px/16px Inter,
            system-ui,
            -apple-system,
            sans-serif;
        color: var(--text);
        background: var(--bg);
    }
    button,
    input,
    select {
        font: inherit;
        color: inherit;
    }
    /* Buttons, fields and links start bare; each class gives its own box */
    button {
        padding: 0;
        border: 0;
        background: none;
    }
    input,
    select {
        border: 0;
    }
    a {
        text-decoration: none;
    }
    svg .filled,
    svg.filled {
        fill: currentColor;
        stroke: none;
    }
    svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    :focus-visible {
        outline: 2px solid var(--border-selected);
        outline-offset: 1px;
    }
    /* The detail view's only rule is under the size control */
    header {
        padding: 8px;
        display: flex;
        gap: 6px;
        align-items: center;
    }
    .search-field {
        position: relative;
        flex: 1;
        min-width: 0;
        color: var(--text-tertiary);
    }
    .search-field svg {
        position: absolute;
        left: 9px;
        top: 8px;
        width: 14px;
        height: 14px;
        pointer-events: none;
    }
    .search {
        width: 100%;
        height: 30px;
        padding: 0 8px 0 29px;
        border-radius: 8px;
        background: var(--bg-secondary);
        color: var(--text);
        outline: none;
        transition: box-shadow 140ms ease-out;
    }
    .search:focus {
        box-shadow:
            inset 0 0 0 1px var(--border-selected),
            0 0 0 3px var(--bg-selected);
    }
    .search:focus-visible {
        outline: none;
    }
    .icon-button {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        transition: background-color 120ms ease-out;
    }
    .icon-button svg {
        width: 16px;
        height: 16px;
    }
    .icon-button:hover {
        background: var(--bg-secondary);
        color: var(--text);
    }
    main {
        flex: 1;
        overflow-y: auto;
    }
    .notice {
        margin: 8px;
        padding: 6px 8px;
        border-radius: 8px;
        background: var(--bg-warning-tertiary);
        color: var(--text);
    }
    .empty {
        padding: 24px 16px;
        text-align: center;
        color: var(--text-tertiary);
    }
    .airline {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 6px 12px;
        border-radius: 0;
        background: transparent;
        text-align: left;
        cursor: pointer;
    }
    .airline:hover,
    .airline:focus-visible {
        background: var(--bg-secondary);
        outline: none;
    }
    .thumb {
        width: 28px;
        height: 28px;
        flex: none;
        object-fit: contain;
    }
    .airline-text {
        flex: 1;
        min-width: 0;
    }
    .airline-name {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .secondary {
        color: var(--text-tertiary);
    }
    .badge {
        margin-left: 4px;
        padding: 0 4px;
        border-radius: 4px;
        background: var(--bg-secondary);
        color: var(--text-secondary);
        font-size: 10px;
    }
    .detail-title {
        flex: 1;
        min-width: 0;
    }
    .detail-title h1 {
        font-size: 13px;
        line-height: 18px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    /* The size and the mono color sit on the same three columns as the pills
       above them, filled where the pills are outlined */
    .controls {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 0 12px;
        padding: 8px 0 10px;
        border-bottom: 1px solid var(--border);
    }
    .mono-field {
        display: contents;
    }
    .field {
        position: relative;
        display: flex;
        gap: 6px;
        align-items: center;
        min-width: 0;
        height: 30px;
        padding: 0 24px 0 10px;
        border-radius: 9px;
        background: var(--bg-secondary);
        cursor: pointer;
    }
    .field > svg {
        position: absolute;
        right: 6px;
        top: 7px;
        width: 16px;
        height: 16px;
        color: var(--text-tertiary);
        pointer-events: none;
    }
    .field-label {
        color: var(--text-tertiary);
    }
    /* The select fills its field, so a click anywhere on it opens the list */
    .field select {
        appearance: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        padding: 0 24px 0 40px;
        border-radius: 9px;
        background: transparent;
        text-overflow: clip;
        cursor: pointer;
    }
    .field-value {
        min-width: 0;
        overflow: hidden;
        text-overflow: clip;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
    }
    .primary-button {
        justify-content: center;
        padding: 0 10px;
    }
    .field input,
    .swatch {
        flex: none;
        width: 14px;
        height: 14px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: none;
        overflow: hidden;
        /* A ring that follows the text color, so a dark swatch shows in the
           dark theme too */
        box-shadow: inset 0 0 0 1px
            color-mix(in srgb, var(--text) 20%, transparent);
        cursor: pointer;
    }
    .field input::-webkit-color-swatch-wrapper {
        padding: 0;
    }
    .field input::-webkit-color-swatch {
        border: 0;
        border-radius: 50%;
    }
    .field input::-moz-color-swatch {
        border: 0;
        border-radius: 50%;
    }
    .section-title {
        padding: 12px 12px 0;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
    }
    /* A kind of mark: its name, and what it is on the right */
    .type-title {
        display: flex;
        gap: 8px;
        align-items: baseline;
        justify-content: space-between;
        padding: 12px 12px 6px;
    }
    .type-title h3 {
        flex: none;
        font-size: 11px;
        font-weight: 600;
    }
    .type-title .secondary {
        min-width: 0;
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .tiles {
        display: grid;
        gap: 8px;
        padding: 0 12px;
    }
    /* The column names stay in view while the marks scroll */
    .detail-head {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--bg);
    }
    .column-titles {
        padding-top: 4px;
    }
    /* Each column's name is a pill */
    .column-title {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
        min-width: 0;
        height: 30px;
        padding: 0 8px;
        border-radius: 9px;
        box-shadow: inset 0 0 0 1px var(--border);
        font-weight: 500;
    }
    .column-title .icon {
        flex: none;
        display: flex;
        color: var(--text-secondary);
    }
    .column-title .icon svg {
        width: 14px;
        height: 14px;
    }
    .column-title span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    #content > .tiles:last-child {
        padding-bottom: 12px;
    }
    .tile-missing {
        border: 1px dashed var(--border);
        border-radius: 12px;
    }
    /* A frame around the preview: the tile's ring, then a 5px gap */
    .tile {
        cursor: pointer;
        display: flex;
        padding: 5px;
        border-radius: 12px;
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--border);
        transition:
            box-shadow 140ms ease-out,
            transform 140ms ease-out;
    }
    .tile:hover,
    .tile:focus-visible {
        box-shadow:
            inset 0 0 0 1.5px var(--border-selected),
            0 6px 16px -8px rgb(0 0 0 / 0.25);
        outline: none;
    }
    .tile:active {
        transform: scale(0.97);
    }
    .tile:disabled {
        cursor: not-allowed;
        opacity: 0.5;
        box-shadow: inset 0 0 0 1px var(--border);
        transform: none;
    }
    .tile-preview {
        width: 100%;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        overflow: hidden;
        /* A light checkerboard in both themes, so white and transparent parts
           show and dark marks stay readable; the dark background version gets
           its own dark preview below */
        --check: #f5f5f5;
        background-color: #fff;
        background-image:
            linear-gradient(45deg, var(--check) 25%, transparent 25%),
            linear-gradient(-45deg, var(--check) 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, var(--check) 75%),
            linear-gradient(-45deg, transparent 75%, var(--check) 75%);
        background-size: 12px 12px;
        background-position:
            0 0,
            0 6px,
            6px -6px,
            -6px 0;
    }
    /* A mark for dark backgrounds shows on one, as it will be used */
    .tile[data-dark='true'] .tile-preview {
        background: #262626;
    }
    .tile-preview img {
        width: 60px;
        height: 60px;
        pointer-events: none;
        transition: transform 180ms ease-out;
    }
    .tile:hover .tile-preview img {
        transform: scale(1.08);
    }
    /* Images fade in once loaded, instead of popping in */
    .fade {
        opacity: 0;
        transition: opacity 200ms ease-out;
    }
    .fade.loaded {
        opacity: 1;
    }
    /* How to use a mark, and the website, in one drop-zone-like line */
    footer {
        padding: 4px 12px 10px;
    }
    .hint {
        display: flex;
        gap: 8px;
        align-items: center;
        height: 34px;
        padding: 0 12px;
        border: 1px dashed
            color-mix(in srgb, var(--text-tertiary) 45%, transparent);
        border-radius: 10px;
        color: var(--text-tertiary);
    }
    .hint svg {
        flex: none;
        width: 16px;
        height: 16px;
    }
    .hint-copy {
        flex: 1;
        min-width: 0;
        display: flex;
        gap: 8px;
        align-items: center;
    }
    .hint-copy span {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .hint a {
        flex: none;
        color: inherit;
    }
    .hint a:hover {
        color: var(--border-selected);
    }
    /* Webflow's own: in the dark theme, a mark with no version for dark
       backgrounds (thumb-chip, from thumbNodes) sits on a light chip, so a
       dark one (oneworld) still shows; every other mark sits on the panel,
       as in the light theme */
    :root:not([data-theme='light']) .thumb-chip {
        padding: 2px;
        border-radius: 6px;
        background: #ffffff;
    }
    /* Uploading and inserting */
    .tile[aria-busy='true'] {
        opacity: 0.5;
        cursor: progress;
    }
    /* The list shows a mark's version for dark backgrounds on the dark
       panel, and its color version in the light theme */
    .thumb-light {
        display: none;
    }
    :root[data-theme='light'] .thumb-light {
        display: block;
    }
    :root[data-theme='light'] .thumb-dark {
        display: none;
    }
    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            transition: none !important;
        }
    }
    [hidden] {
        display: none !important;
    }
</style>
<section id="list-view">
    <header>
        <label class="search-field">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="7" cy="7" r="4.5" />
                <path d="m10.5 10.5 3 3" />
            </svg>
            <input
                id="search"
                class="search"
                type="search"
                placeholder="Search airlines and alliances"
                aria-label="Search airlines and alliances by name, IATA or ICAO code"
                autocomplete="off"
                spellcheck="false"
                autofocus
            />
        </label>
    </header>
</section>
<section id="detail-view" hidden>
    <header>
        <button
            id="back"
            class="icon-button"
            title="Back to the list"
            aria-label="Back to the list"
        >
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M10 3.5 5.5 8l4.5 4.5" />
            </svg>
        </button>
        <div class="detail-title">
            <h1 id="detail-name"></h1>
            <div id="detail-meta" class="secondary"></div>
        </div>
    </header>
    <!-- Moved under the column names when an airline is shown -->
    <div id="controls" class="controls">
        <label class="field" title="Size of an inserted mark">
            <span class="field-label">Size</span>
            <select id="size"></select>
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="m5 6.5 3 3 3-3" />
            </svg>
        </label>
        <!-- The mono marks' color, under the Mono column's name: a
             picker, and the airline's primary color in one click -->
        <div id="mono-field" class="mono-field">
            <label class="field" title="Pick the color of the mono marks">
                <input id="mono" type="color" />
                <span id="mono-value" class="field-value"></span>
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="m5 6.5 3 3 3-3" />
                </svg>
            </label>
            <button id="primary" class="field primary-button" type="button">
                <span id="primary-swatch" class="swatch"></span>
                Primary
            </button>
        </div>
    </div>
</section>
<main id="content"></main>
<footer>
    <!-- One tip per view: what the list can be searched by, how to
         use a mark in the detail view -->
    <div class="hint">
        <span id="list-hint" class="hint-copy">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="7" cy="7" r="4.5" />
                <path d="m10.5 10.5 3 3" />
            </svg>
            <span>Try VN, HVN or Vietnam</span>
        </span>
        <span id="detail-hint" class="hint-copy" hidden>
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M6 1.5V3M2.4 2.9l1.1 1.1M1.5 6.5H3" />
                <path d="m6 6 7.5 2.75-3.25 1.25-1.25 3.25z" class="filled" />
            </svg>
            <span>Select, then click a mark</span>
        </span>
        <a href="https://soaringsymbols.org" target="_blank" rel="noreferrer"
            >soaringsymbols.org</a
        >
    </div>
</footer>
<script src="index.js" defer></script>
